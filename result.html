<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

    --accent: #1E8CFA; --accent-soft: #3BA5FF; --accent-glow: rgba(30,140,250,0.15);

    --text-secondary: #8DAAC8; --text-muted: #4A6480;
    --border: rgba(30,140,250,0.18); --border-subtle: rgba(255,255,255,0.06);

  body { font-family: 'DM Sans', sans-serif; background: var(--blue-deep); color: var(--text-primary); min-height: 100vh; padding: 2rem 1rem 5rem; display: flex; flex-direction: column; align-items: center; }

  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; color: var(--text-primary); text-decoration: none; }
  .logo span { color: var(--accent); }
  .card { background: var(--blue-mid); border: 0.5px solid var(--border); border-radius: 20px; padding: 2rem; box-shadow: 0 8px 60px rgba(0,0,0,0.4); margin-bottom: 1rem; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .card-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
  .copy-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 100px; background: rgba(30,140,250,0.1); border: 0.5px solid var(--accent-line); color: var(--accent); font-size: 0.72rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-transform: none; letter-spacing: 0; }
  .copy-btn:hover { background: var(--accent-glow); }
  .copy-btn.copied { background: rgba(0,201,141,0.12); border-color: rgba(0,201,141,0.4); color: var(--success); }
  .urgency-badge { display: inline-flex; align-items: center; gap: 8px; padding: 0.4rem 1.2rem; border-radius: 100px; font-size: 0.85rem; font-weight: 700; font-family: 'Syne', sans-serif; margin-bottom: 1.5rem; }
  .spec-row { display: flex; align-items: center; gap: 10px; padding: 0.7rem 1rem; background: rgba(255,255,255,0.02); border: 0.5px solid var(--border-subtle); border-radius: 10px; margin-bottom: 1rem; font-size: 0.88rem; }
  .spec-label { color: var(--text-muted); } .spec-arrow { color: var(--accent); font-weight: 700; } .spec-val { color: var(--accent); font-weight: 600; }
  .desc-row { display: flex; padding: 6px 0; border-bottom: 0.5px solid var(--border-subtle); font-size: 0.88rem; }

  .desc-key { color: var(--text-muted); min-width: 140px; font-weight: 300; } .desc-val { color: var(--text-primary); }

  /* LISTA INVESTIGATII */

function detectInvestigKey(text) {
  const t = text.toLowerCase();
  if (t.includes('substanță de contrast') || t.includes('substanta de contrast')) return 'ct-contrast';
  if (t.includes('ct ') || t.includes('ct—') || t.includes('ct,') || t.startsWith('ct')) return 'ct';
  if (t.includes('rmn') || t.includes('rezonanță') || t.includes('rezonanta')) return 'rmn';
  if (t.includes('radiografie') || t.includes('radiograf')) return 'radiografie';
  if (t.includes('ecografie')) return 'ecografie';
  if (t.includes('analize') || t.includes('vsh') || t.includes('crp') || t.includes('acid uric') || t.includes('anti-ccp') || t.includes('fibrinogen')) return 'analize';
  if (t.includes('emg') || t.includes('electromiograf')) return 'emg';
  if (t.includes('puncție') || t.includes('punctie')) return 'punctie';
  return null;
}

function openInvModal(key) {
  const data = investigatiiDB[key];
  if (!data) return;
  document.getElementById('invModalTitle').textContent = data.titlu;
  document.getElementById('invModalCeEste').textContent = data.ceEste;
  document.getElementById('invModalDeCe').textContent = data.deCe;
  document.getElementById('invModalPregatire').textContent = data.pregatire;
  const warnEl = document.getElementById('invModalWarn');
  if (data.atentie) {
    document.getElementById('invModalWarnText').textContent = data.atentie;
    warnEl.style.display = 'block';
  } else {
    warnEl.style.display = 'none';
  }
  document.getElementById('invModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeInvModal() {
  document.getElementById('invModal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('invModal').addEventListener('click', function(e) {
  if (e.target === this) closeInvModal();
});

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    nume: p.get('nume') || '',
    zona: p.get('zona') || '—',
    durata: p.get('durata') || '—',
    declansator: p.get('declansator') || '—',
    simptome: p.get('simptome') || '—',
    mobilitate: p.get('mobilitate') || '—',
    urgenta: p.get('urgenta') || '—',
    urgenta_level: p.get('urgenta_level') || 'med',
    investigatii: decodeURIComponent(p.get('investigatii') || '').split('|').filter(Boolean),
    sector: parseInt(p.get('sector')) || null,
    data: p.get('data') || '',
  };
}

  if (level === 'low')  return 'background:rgba(0,201,141,0.1);color:#00C98D;border:1.5px solid rgba(0,201,141,0.3);';
  if (level === 'high') return 'background:rgba(255,140,66,0.1);color:#FF8C42;border:1.5px solid rgba(255,140,66,0.3);';
  return 'background:rgba(255,200,0,0.08);color:#FFC800;border:1.5px solid rgba(255,200,0,0.3);';
}

async function trackClick(clinicName, sector, zona, urgenta, booking) {
  if (typeof gtag === 'function') {
    gtag('event', 'clinic_booking_click', { clinic_name: clinicName, sector: 'Sector ' + sector, zona, urgenta });
  }
  try {
    await fetch(WEBHOOK_CLINIC_CLICKS, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tip_event: 'clinic_click', clinica: clinicName, sector: 'Sector ' + sector, zona, urgenta, source: 'result_page', data: new Date().toLocaleString('ro-RO') })
    });
  } catch(e) {}
  window.open(booking, '_blank');
}

function copyText(id, btnId) {
  const el = document.getElementById(id);
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(function() {
    const btn = document.getElementById(btnId);
    btn.textContent = '✓ Copiat!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '📋 Copiează'; btn.classList.remove('copied'); }, 2500);
  });
}

function render() {
  const d = getParams();
  const sectorData = d.sector ? clinicsDB[d.sector] : null;
  const calSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  const mapSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

  const investigatiiHtml = d.investigatii.map(function(inv) {
    const key = detectInvestigKey(inv);
    const btnHtml = key
      ? '<button class="btn-afla" onclick="openInvModal(\'' + key + '\')">ℹ️ Află mai mult</button>'
      : '';
    return '<li class="investig-item"><div class="investig-row">' + inv + '</div>' + btnHtml + '</li>';
  }).join('');

  const cliniciHtml = sectorData ? sectorData.clinics.map(function(c) {
    const bookBtn = c.booking
      ? '<a class="btn-book" href="#" onclick="trackClick(\'' + c.name.replace(/'/g, "\\'") + '\',' + d.sector + ',\'' + d.zona + '\',\'' + d.urgenta + '\',\'' + c.booking + '\');return false;">' + calSvg + ' Programare ortopedie</a>'
      : '<span style="font-size:0.78rem;color:var(--text-muted);">Contactați direct</span>';
    return '<div class="clinic-card"><div class="clinic-name">' + c.name + '</div><div class="clinic-addr">📍 ' + c.address + '</div><div class="clinic-btns">' + bookBtn + '<a class="btn-maps" href="https://maps.google.com/?q=' + c.maps + '" target="_blank">' + mapSvg + ' Hartă</a></div></div>';
  }).join('') : '<p style="color:var(--text-muted);font-size:0.85rem;">Sectorul nu a fost specificat.</p>';

  document.getElementById('content').innerHTML =
    (d.nume ? '<p style="font-size:0.95rem;color:var(--text-secondary);margin-bottom:1.2rem;">Bună <strong style="color:var(--text-primary);">' + d.nume + '</strong>, aici este sumarul evaluării tale.</p>' : '') +

    '<div class="card" style="margin-bottom:0.8rem;">' +
      '<div style="margin-bottom:0.8rem;"><span class="urgency-badge" style="' + urgencyStyle(d.urgenta_level) + '">' + d.urgenta + '</span></div>' +
      '<div class="spec-row"><span class="spec-label">Specialitate recomandată</span><span class="spec-arrow">→</span><span class="spec-val">Ortopedie</span></div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:0.8rem;">' +
      '<div class="card-label">Descriere<button class="copy-btn" id="btn-desc" onclick="copyText(\'desc-text\',\'btn-desc\')">📋 Copiază</button></div>' +
      '<div id="desc-text">' +
        '<div class="desc-row"><span class="desc-key">Zonă afectată</span><span class="desc-val">' + d.zona + '</span></div>' +
        '<div class="desc-row"><span class="desc-key">Durată simptome</span><span class="desc-val">' + d.durata + '</span></div>' +
        '<div class="desc-row"><span class="desc-key">Declanșator</span><span class="desc-val">' + d.declansator + '</span></div>' +
        '<div class="desc-row"><span class="desc-key">Simptome asociate</span><span class="desc-val">' + d.simptome + '</span></div>' +
        '<div class="desc-row"><span class="desc-key">Mobilitate</span><span class="desc-val">' + d.mobilitate + '</span></div>' +
      '</div>' +
      '<p style="font-size:0.72rem;color:var(--text-muted);margin-top:0.8rem;">Copiați și puneți la câmpul "Descriere" de pe site-ul clinicii, dacă există.</p>' +
    '</div>' +

    '<div class="card" style="margin-bottom:0.8rem;">' +
      '<div class="card-label">Investigații recomandate<button class="copy-btn" id="btn-inv" onclick="copyText(\'inv-text\',\'btn-inv\')">📋 Copiează</button></div>' +
      '<ul class="investig-list" id="inv-text">' + investigatiiHtml + '</ul>' +
      '<p style="font-size:0.72rem;color:var(--text-muted);margin-top:0.8rem;">Copiați și puneți la câmpul "Investigații" de pe site-ul clinicii, dacă există.</p>' +
    '</div>' +

    '<div class="card" style="margin-bottom:0.8rem;">' +
      '<div class="card-label" style="margin-bottom:1rem;">' + (sectorData ? sectorData.label : 'Clinici') + '</div>' +
      cliniciHtml +
    '</div>' +

    '<div class="disclaimer"><strong>Notă:</strong> Evaluarea are caracter orientativ și nu constituie un diagnostic medical. TriajMed nu validează nicio clinică. Consultați întotdeauna un medic specialist.</div>';
}

render();
</script>
</body>
</html>
